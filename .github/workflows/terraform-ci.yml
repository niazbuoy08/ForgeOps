name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [bootstrap, environments/dev, environments/staging, environments/prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt (check)
        run: terraform fmt -check -recursive terraform

      - name: terraform init (no backend - validate only)
        working-directory: terraform/${{ matrix.stack }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: terraform/${{ matrix.stack }}
        run: terraform validate

  plan:
    if: github.event_name == 'pull_request'
    needs: fmt-validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      # Uses OpenID Connect federation - no client secret stored in GitHub.
      # Requires an Azure AD app registration federated to this repo; see
      # docs/deployment.md for the exact `az ad app federated-credential` command.
      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: terraform init
        if: vars.AZURE_CLIENT_ID != ''
        working-directory: terraform/environments/${{ matrix.environment }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ matrix.environment }}.terraform.tfstate"

      - name: terraform plan
        if: vars.AZURE_CLIENT_ID != ''
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform plan -input=false -var-file=terraform.tfvars

      - name: Skipped - no Azure credentials configured
        if: vars.AZURE_CLIENT_ID == ''
        run: echo "Set AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID repo variables to enable plan."
