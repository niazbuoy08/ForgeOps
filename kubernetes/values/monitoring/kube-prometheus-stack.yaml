# Values for the prometheus-community/kube-prometheus-stack chart, applied by
# scripts/install-monitoring.sh. One cluster-wide instance - not per Argo CD
# environment - consistent with the "stand up only dev" cost guidance in the
# root README. No persistent storage: metrics are ephemeral, which is fine
# for a portfolio/demo cluster you tear down between demos.

prometheus:
  prometheusSpec:
    retention: 6h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Without these, the Prometheus Operator only picks up ServiceMonitors/
    # PrometheusRules carrying its own Helm release label, which would make
    # kubernetes/helm/backend/templates/servicemonitor.yaml invisible to it.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # ingress-nginx already exposes /metrics (controller.metrics.enabled=true
    # in scripts/install-nginx-ingress.sh); nothing scrapes it without this.
    additionalServiceMonitors:
      - name: ingress-nginx
        namespaceSelector:
          matchNames: ["ingress-nginx"]
        selector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
            app.kubernetes.io/component: controller
        endpoints:
          - port: metrics
            interval: 30s

    additionalPrometheusRulesMap:
      backend-alerts:
        groups:
          - name: backend.rules
            rules:
              - alert: BackendDown
                expr: up{job="backend"} == 0
                for: 2m
                labels:
                  severity: critical
                annotations:
                  summary: "Backend is down"
                  description: "No Prometheus targets for job=backend have been up for 2 minutes."
              - alert: BackendHighErrorRate
                expr: |
                  sum(rate(http_requests_total{job="backend", status=~"5.."}[5m]))
                  /
                  sum(rate(http_requests_total{job="backend"}[5m])) > 0.05
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "Backend 5xx rate above 5%"
                  description: "{{ $value | humanizePercentage }} of backend requests have returned 5xx over the last 5 minutes."
              - alert: BackendHighLatencyP95
                expr: |
                  histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job="backend"}[10m])) by (le)) > 1
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "Backend p95 latency above 1s"
                  description: "p95 request latency has been above 1s for 10 minutes."

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  # Admin password is generated per-install by scripts/install-monitoring.sh
  # (--set grafana.adminPassword=<random>) rather than left at the chart's
  # "prom-operator" default - never committed here, retrieve it from the
  # kube-prometheus-stack-grafana Secret (see docs/observability.md).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      # Same namespace as the Grafana pod (monitoring) - matches where
      # kubernetes/monitoring/dashboards/*.yaml is applied.

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
