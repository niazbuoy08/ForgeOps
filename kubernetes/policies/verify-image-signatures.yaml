apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify Image Signatures (cosign keyless)
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Requires backend/frontend images to carry a valid cosign keyless
      signature produced by .github/workflows/docker-build-push.yml - see
      docs/security.md#supply-chain-security. Starts in Audit (report-only,
      same reasoning as Trivy's exit-code: "0" in security-scan.yml) because
      it depends on the <your-org>/<your-repo> subject below actually
      matching your fork; flip to Enforce once you've confirmed it passes.
spec:
  validationFailureAction: Audit
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "*.azurecr.io/aks-platform-*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/<your-org>/<your-repo>/.github/workflows/docker-build-push.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
