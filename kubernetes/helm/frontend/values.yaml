replicaCount: 1

image:
  repository: ""  # e.g. myacr.azurecr.io/aks-platform-frontend
  tag: ""
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

podSecurityContext:
  fsGroup: 101

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75

probes:
  liveness:
    path: /
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /
    periodSeconds: 10
    failureThreshold: 3

networkPolicy:
  enabled: true
  # Namespace the NGINX ingress controller runs in - traffic from here is
  # allowed to reach this pod. Uses the well-known kubernetes.io/metadata.name
  # label that Kubernetes sets automatically on every namespace.
  ingressNamespace: ingress-nginx

nodeSelector: {}
tolerations: []
affinity: {}
