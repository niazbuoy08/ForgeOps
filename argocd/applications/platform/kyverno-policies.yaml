# Plain-manifest Application (no Helm) - just applies every ClusterPolicy
# under kubernetes/policies/. Requires the Kyverno controller
# (scripts/install-kyverno.sh) to already be installed; ClusterPolicy is a
# CRD it owns.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  project: aks-platform
  source:
    repoURL: https://github.com/<your-org>/<your-repo>.git
    targetRevision: main
    path: kubernetes/policies
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
