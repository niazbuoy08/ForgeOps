apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-ingress
  namespace: argocd
spec:
  project: aks-platform
  source:
    repoURL: https://github.com/<your-org>/<your-repo>.git
    targetRevision: main
    path: kubernetes/helm/ingress
    helm:
      releaseName: ingress
      valueFiles:
        - ../../values/staging/ingress.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
